# Tool configuration only. This repo is not an installable package.

[tool.pytest.ini_options]
# The scripts import each other by plain module name (for example
# `import scope`), which works when a script is run directly because Python
# puts the script's own folder on the import path. Adding `scripts` here gives
# the tests the same import path, so tests can `import scope` too.
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
