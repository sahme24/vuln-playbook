# Tool configuration only. This repo is not an installable package.

[tool.pytest.ini_options]
# The scripts import each other by plain module name (for example
# `import scope`), which works when a script is run directly because Python
# puts the script's own folder on the import path. Adding `scripts` here gives
# the tests the same import path, so tests can `import scope` too.
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# The rule set is named explicitly instead of relying on ruff's defaults.
# Newer ruff releases enable more rules by default (import sorting, SIM, PERF,
# UP, PLC). Several of those push toward the compact style this project avoids
# on purpose: merging nested `with` blocks, `list(x)` instead of an explicit
# loop, `.items()` unpacking. Pinning the selection keeps CI and every local
# install checking the same thing, whatever ruff version pip picks.
# This is ruff's classic default set: E4/E7/E9 (import placement, statement
# errors, syntax errors) and F (pyflakes: unused imports, undefined names...).
select = ["E4", "E7", "E9", "F"]
